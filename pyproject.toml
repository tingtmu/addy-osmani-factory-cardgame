[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardengine"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = '^(\.venv|docs|\.claude|\.agents|\.codex|\.factory)/'

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = [".venv", "docs", ".claude", ".agents", ".codex", ".factory"]
